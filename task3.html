<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 3 - Варіант 3.7</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #fafafa; }
        .frames-wrapper { display: flex; gap: 20px; margin-bottom: 20px; }
        iframe { width: 50%; height: 150px; border: 2px solid #34495e; border-radius: 6px; background: #fff; }
        textarea { width: 100%; height: 100px; font-family: monospace; padding: 10px; box-sizing: border-box; }
        button { padding: 10px 25px; font-size: 16px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #219150; }
    </style>
</head>
<body>
    <h2>Завдання 3 (Варіант 3.7): Динамічна зміна вмісту двох другорядних фреймів</h2>
    
    <div class="frames-wrapper">
        <iframe id="frame1" srcdoc="<body style='font-family:sans-serif;'><h3>Другорядний Фрейм №1</h3><p>Початковий вміст фрейму 1</p></body>"></iframe>
        <iframe id="frame2" srcdoc="<body style='font-family:sans-serif;'><h3>Другорядний Фрейм №2</h3><p>Початковий вміст фрейму 2</p></body>"></iframe>
    </div>

    <form name="taskForm">
        <button type="button" onclick="runTask()">Run Task</button><br><br>
        <label for="outputConsole"><b>Результат виконання сценарію:</b></label><br>
        <textarea id="outputConsole" readonly placeholder="Натисніть 'Run Task'..."></textarea>
    </form>

    <script>
        function runTask() {
            const frame1 = document.getElementById('frame1');
            const frame2 = document.getElementById('frame2');
            const output = document.getElementById('outputConsole');
            const timestamp = new Date().toLocaleTimeString();

            frame1.srcdoc = `
                <body style="background-color: #e8f8f5; font-family: sans-serif; padding: 10px;">
                    <h3 style="color: #16a085;">Фрейм №1 (Оновлено)</h3>
                    <p style="color: #2c3e50;">Вміст успішно змінено JS-сценарієм о ${timestamp}.</p>
                </body>
            `;

            frame2.srcdoc = `
                <body style="background-color: #ffebee; font-family: sans-serif; padding: 10px;">
                    <h3 style="color: #c62828;">Фрейм №2 (Оновлено)</h3>
                    <p style="color: #37474f;">Зміна двох другорядних фреймів виконана згідно з варіантом 3.7.</p>
                </body>
            `;

            output.value = `[${timestamp}] Сценарій виконано:\n- Змінено вміст Фрейму 1\n- Змінено вміст Фрейму 2\nStatus: Успішно!`;
            console.log('Run Task executed: Frame 1 and Frame 2 content updated.');
        }
    </script>
</body>
</html>
