<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 5 - Варіант 5.3 / 5.4</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #fdfdfd; }
        .container { max-width: 700px; background: white; padding: 20px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 120px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 10px; padding: 10px 20px; background-color: #2980b9; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #3498db; }
        .result-box { margin-top: 15px; padding: 15px; background: #eef7fc; border-left: 4px solid #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Завдання 5 (Варіант 5.3 / 5.4): Пошук цифр та цілих чисел за допомогою регулярних виразів</h2>

        <form name="searchForm">
            <label for="inputText"><b>Вхідний текст для аналізу:</b></label><br><br>
            <textarea id="inputText" placeholder="Введіть текст...">У 2026 році на курсі з 15 дисциплін було виконано 7 лабораторних робіт та отримано 100 балів.</textarea><br>
            <button type="button" onclick="searchInfo()">пошуку інформації</button>
        </form>

        <div id="resultBox" class="result-box">
            Результати пошуку з'являться після натискання кнопки.
        </div>
    </div>

    <script>
        function searchInfo() {
            const text = document.getElementById('inputText').value;

            // 5.3: Пошук окремих цифр
            const digitsMatch = text.match(/\d/g);
            const digitsCount = digitsMatch ? digitsMatch.length : 0;

            // 5.4: Пошук цілих чисел
            const integersMatch = text.match(/\b\d+\b/g);
            const integersCount = integersMatch ? integersMatch.length : 0;

            document.getElementById('resultBox').innerHTML = `
                <h4>Результати аналізу регулярними виразами:</h4>
                <p><b>5.3. Кількість цифр:</b> ${digitsCount} <br>
                   <i>Знайдені цифри:</i> [ ${digitsMatch ? digitsMatch.join(', ') : 'не знайдено'} ]</p>
                <p><b>5.4. Кількість цілих чисел:</b> ${integersCount} <br>
                   <i>Знайдені цілі числа:</i> [ ${integersMatch ? integersMatch.join(', ') : 'не знайдено'} ]</p>
            `;
        }
    </script>
</body>
</html>
