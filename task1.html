<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Script-Type" content="text/javascript"
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 1 - Події вікна (&lt;BODY&gt;)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f8f9fa; }
        h1 { color: #2c3e50; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 180px; font-family: monospace; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body 
  onload="logEvent('onload: Вміст веб-сторінки повністю завантажено (включаючи зображення та скрипти)')"
  onblur="logEvent('onblur: Вікно втратило фокус')"
  onfocus="logEvent('onfocus: Вікно отримало фокус')"
  onresize="logEvent('onresize: Розмір вікна було змінено')"
  onbeforeprint="logEvent('onbeforeprint: Підготовка документу до друку')"
  onafterprint="logEvent('onafterprint: Документ роздруковано або вікно друку закрито')"
  onpagehide="logEvent('onpagehide: Вікно приховано')"
  onpageshow="logEvent('onpageshow: Вікно стало видимим')"
>
    <div class="container">
        <h1>Завдання 1: Обробка подій тегу &lt;BODY&gt;</h1>
        <p>Скрипт відстежує події головного вікна (наприклад: завантаження сторінки, фокус/втрату фокусу, зміну розміру вікна, підготовку до друку <code>Ctrl+P</code> тощо).</p>
        
        <label for="event-log"><b>Журнал зареєстрованих подій:</b></label><br><br>
        <textarea id="event-log" readonly placeholder="Події з'являтимуться тут..."></textarea>
    </div>

    <script>
        function logEvent(message) {
            const log = document.getElementById('event-log');
            if (log) {
                const time = new Date().toLocaleTimeString();
                log.value += `[${time}] ${message}\n`;
                log.scrollTop = log.scrollHeight;
            }
        }
    </script>
</body>
</html>
